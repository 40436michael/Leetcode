name: Auto Update LeetCode README

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ============================================================
      # Checkout Repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Set up Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ============================================================
      # Generate README
      # ============================================================
      - name: Generate README
        run: |
          python <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          from datetime import datetime


          # ==========================================================
          # 設定
          # ==========================================================
          SOLUTIONS_DIR = "solutions"
          README_FILE = "README.md"

          LEETCODE_GRAPHQL = "https://leetcode.com/graphql"


          # ==========================================================
          # LeetCode GraphQL Query
          # ==========================================================
          QUERY = """
          query questionData($titleSlug: String!) {
              question(titleSlug: $titleSlug) {
                  questionFrontendId
                  title
                  titleSlug
                  difficulty
                  topicTags {
                      name
                      slug
                  }
              }
          }
          """


          # ==========================================================
          # 從檔名產生 title slug
          #
          # 例如：
          #
          # 1.two-sum.cpp
          #       ↓
          # two-sum
          #
          # 217.contains-duplicate.cpp
          #       ↓
          # contains-duplicate
          # ==========================================================
          def get_title_slug(filename):

              match = re.match(
                  r"^(\d+)\.(.+)\.cpp$",
                  filename
              )

              if not match:
                  return None

              slug = match.group(2).lower()

              # 空白 → -
              slug = slug.replace(" ", "-")

              # 底線 → -
              slug = slug.replace("_", "-")

              # 移除重複的 -
              slug = re.sub(
                  r"-+",
                  "-",
                  slug
              )

              return slug.strip("-")


          # ==========================================================
          # 從 LeetCode API 取得資料
          # ==========================================================
          def fetch_leetcode_problem(title_slug):

              payload = json.dumps({
                  "operationName": "questionData",
                  "variables": {
                      "titleSlug": title_slug
                  },
                  "query": QUERY
              }).encode("utf-8")


              request = urllib.request.Request(
                  LEETCODE_GRAPHQL,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  },
                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = json.loads(
                          response.read().decode("utf-8")
                      )


                  question = (
                      data
                      .get("data", {})
                      .get("question")
                  )


                  if not question:
                      return None


                  return question


              except Exception as e:

                  print(
                      f"WARNING: 無法取得 "
                      f"{title_slug}: {e}"
                  )

                  return None


          # ==========================================================
          # 搜尋 solutions/*.cpp
          # ==========================================================
          files = []

          if os.path.isdir(SOLUTIONS_DIR):

              for filename in os.listdir(SOLUTIONS_DIR):

                  if filename.endswith(".cpp"):
                      files.append(filename)

          else:

              print(
                  f"ERROR: 找不到 {SOLUTIONS_DIR}/"
              )


          # ==========================================================
          # 取得題號
          # ==========================================================
          def get_number(filename):

              match = re.match(
                  r"^(\d+)",
                  filename
              )

              if match:
                  return int(match.group(1))

              return 999999


          # ==========================================================
          # 題號排序
          # ==========================================================
          files.sort(
              key=get_number
          )


          # ==========================================================
          # Difficulty icon
          # ==========================================================
          difficulty_icon = {
              "Easy": "🟢 Easy",
              "Medium": "🟡 Medium",
              "Hard": "🔴 Hard"
          }


          # ==========================================================
          # Statistics
          # ==========================================================
          easy_count = 0
          medium_count = 0
          hard_count = 0


          problem_rows = []


          # ==========================================================
          # API Cache
          #
          # 同一次 Action 不重複查詢相同題目
          # ==========================================================
          cache = {}


          # ==========================================================
          # 處理每一個 Solution
          # ==========================================================
          for filename in files:

              match = re.match(
                  r"^(\d+)\.(.+)\.cpp$",
                  filename
              )

              if not match:

                  print(
                      f"WARNING: 無法解析檔名：{filename}"
                  )

                  continue


              number = match.group(1)

              filename_title = match.group(2)

              title_slug = get_title_slug(
                  filename
              )


              # ------------------------------------------------------
              # API
              # ------------------------------------------------------
              question = None


              if title_slug:

                  if title_slug in cache:

                      question = cache[
                          title_slug
                      ]

                  else:

                      print(
                          f"Fetching LeetCode #{number}: "
                          f"{title_slug}"
                      )

                      question = fetch_leetcode_problem(
                          title_slug
                      )

                      cache[
                          title_slug
                      ] = question


              # ------------------------------------------------------
              # 如果 API 成功
              # ------------------------------------------------------
              if question:

                  title = question.get(
                      "title",
                      filename_title
                          .replace("-", " ")
                          .title()
                  )

                  difficulty = question.get(
                      "difficulty",
                      "Unknown"
                  )

                  topic_tags = question.get(
                      "topicTags",
                      []
                  )

                  tags = [
                      tag.get("name", "")
                      for tag in topic_tags
                      if tag.get("name")
                  ]

              # ------------------------------------------------------
              # 如果 API 失敗
              # ------------------------------------------------------
              else:

                  print(
                      f"WARNING: "
                      f"使用檔名作為 fallback："
                      f"{filename}"
                  )

                  title = (
                      filename_title
                      .replace("-", " ")
                      .title()
                  )

                  difficulty = "Unknown"

                  tags = []


              # ------------------------------------------------------
              # Difficulty 統計
              # ------------------------------------------------------
              if difficulty == "Easy":

                  easy_count += 1

              elif difficulty == "Medium":

                  medium_count += 1

              elif difficulty == "Hard":

                  hard_count += 1


              # ------------------------------------------------------
              # Difficulty 顯示
              # ------------------------------------------------------
              difficulty_display = difficulty_icon.get(
                  difficulty,
                  "⚪ Unknown"
              )


              # ------------------------------------------------------
              # Tags
              # ------------------------------------------------------
              if tags:

                  tags_display = ", ".join(tags)

              else:

                  tags_display = "-"


              # ------------------------------------------------------
              # LeetCode URL
              # ------------------------------------------------------
              if title_slug:

                  leetcode_link = (
                      f"[🔗](https://leetcode.com/problems/"
                      f"{title_slug}/)"
                  )

              else:

                  leetcode_link = "-"


              # ------------------------------------------------------
              # Solution URL
              # ------------------------------------------------------
              solution_link = (
                  f"[C++](./solutions/{filename})"
              )


              # ------------------------------------------------------
              # README row
              # ------------------------------------------------------
              problem_rows.append(
                  f"| {number} | {title} | "
                  f"{difficulty_display} | "
                  f"{tags_display} | "
                  f"{leetcode_link} | "
                  f"{solution_link} |"
              )


          # ==========================================================
          # Recent Solutions
          # ==========================================================
          recent_solutions = []


          for filename in files:

              filepath = os.path.join(
                  SOLUTIONS_DIR,
                  filename
              )


              try:

                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%aI",
                          "--",
                          filepath
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )


                  date_string = (
                      result.stdout.strip()
                  )


                  if date_string:

                      date = datetime.fromisoformat(
                          date_string.replace(
                              "Z",
                              "+00:00"
                          )
                      )


                      recent_solutions.append(
                          (
                              date,
                              filename
                          )
                      )


              except Exception as e:

                  print(
                      f"WARNING: "
                      f"無法取得 {filename} 日期：{e}"
                  )


          # ==========================================================
          # 最近修改排序
          # ==========================================================
          recent_solutions.sort(
              key=lambda x: x[0],
              reverse=True
          )


          # 最近 10 題
          recent_solutions = (
              recent_solutions[:10]
          )


          recent_rows = []


          for date, filename in recent_solutions:

              match = re.match(
                  r"^(\d+)\.(.+)\.cpp$",
                  filename
              )


              if not match:
                  continue


              number = match.group(1)

              title_slug = get_title_slug(
                  filename
              )


              question = cache.get(
                  title_slug
              )


              if question:

                  title = question.get(
                      "title",
                      match.group(2)
                          .replace("-", " ")
                          .title()
                  )

              else:

                  title = (
                      match.group(2)
                      .replace("-", " ")
                      .title()
                  )


              date_display = date.strftime(
                  "%Y-%m-%d"
              )


              recent_rows.append(
                  f"| {number} | {title} | "
                  f"{date_display} |"
              )


          # ==========================================================
          # README
          # ==========================================================
          readme_content = (
              "# 🚀 LeetCode C++ 解題紀錄\n\n"
          )


          readme_content += (
              "此 README 由 GitHub Actions "
              "自動產生與維護。\n\n"
          )


          # ==========================================================
          # Progress
          # ==========================================================
          total = len(files)


          readme_content += (
              "## 📊 Progress\n\n"
          )


          readme_content += (
              "| 難度 | 題數 |\n"
          )


          readme_content += (
              "| :---: | ---: |\n"
          )


          readme_content += (
              f"| 🟢 Easy | {easy_count} |\n"
          )


          readme_content += (
              f"| 🟡 Medium | {medium_count} |\n"
          )


          readme_content += (
              f"| 🔴 Hard | {hard_count} |\n"
          )


          readme_content += (
              f"| **Total** | **{total}** |\n\n"
          )


          # ==========================================================
          # Problems
          # ==========================================================
          readme_content += (
              "## 📚 Problems\n\n"
          )


          readme_content += (
              "| 題號 | 題目名稱 | 難度 | Tags | "
              "LeetCode | 解答 |\n"
          )


          readme_content += (
              "| :---: | :--- | :---: | :--- | "
              ":---: | :---: |\n"
          )


          for row in problem_rows:

              readme_content += (
                  row + "\n"
              )


          readme_content += "\n"


          # ==========================================================
          # Recent Solutions
          # ==========================================================
          readme_content += (
              "## 🔥 Recent Solutions\n\n"
          )


          if recent_rows:

              readme_content += (
                  "| 題號 | 題目名稱 | 解題日期 |\n"
              )


              readme_content += (
                  "| :---: | :--- | :---: |\n"
              )


              for row in recent_rows:

                  readme_content += (
                      row + "\n"
                  )

          else:

              readme_content += (
                  "目前沒有解題紀錄。\n"
              )


          readme_content += "\n"


          # ==========================================================
          # Write README
          # ==========================================================
          with open(
              README_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  readme_content
              )


          # ==========================================================
          # GitHub Actions Log
          # ==========================================================
          print("")
          print("=" * 60)
          print("README updated successfully!")
          print("=" * 60)
          print(f"Solutions: {total}")
          print(f"Easy:      {easy_count}")
          print(f"Medium:    {medium_count}")
          print(f"Hard:      {hard_count}")
          print("=" * 60)

          PY

      # ============================================================
      # Commit and Push README
      # ============================================================
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README.md [skip ci]"